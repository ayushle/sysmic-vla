# =============================================================================
#  SYSMIC 2.0 - RTAB-Map LOCALIZATION parameters (map is NOT extended)
#  Used by: sysmic_localization.launch.py
#
#  The database built with sysmic_mapping.launch.py is loaded read-only; the robot
#  only localizes against it. Give a rough start pose with RViz "2D Pose Estimate"
#  (/initialpose) if it does not relocalize by itself.
#
#  Pipeline
#    /scan_top  --scan_top_to_cloud---\
#                                      >-- scan_merger --> /sysmic/scan_merged (PointCloud2, base_link)
#    /scan_base --scan_base_to_cloud--/          |
#                                                v
#                          icp_odometry (scan only, + /imu; no wheel odom)
#                                                | /icp_odom   TF: icp_odom -> base_link
#    /head_camera/depth --register_depth--\      v
#    /head_camera/color -----------------> rgbd_sync --> rtabmap (LOCALIZATION) --> /map (saved)
#                                                         TF: map -> icp_odom
#
#  TF tree:  map -> icp_odom -> base_link -> sensors
#  (start the sim with publish_odom:=false, the default: base_link must have one parent)
#
#  RULES
#   * Every RTAB-Map "Group/Name" parameter MUST be a quoted string ("1", "true", "0.05").
#   * Plain ROS parameters (frame_id, approx_sync, ...) use normal YAML types.
#   * Full list of RTAB-Map parameters with docs:  rtabmap --params
#   * Arg-dependent values (use_sim_time, database_path, odom topic) are set by the
#     launch file and override this file.
# =============================================================================

# ---------------------------------------------------------------------------
# Lidar preprocessing
# ---------------------------------------------------------------------------
scan_top_to_cloud:            # pointcloud_to_laserscan::LaserScanToPointCloudNode
  ros__parameters:
    target_frame: ""          # "" = keep the lidar frame; scan_merger transforms to base_link
    transform_tolerance: 0.05
    queue_size: 10

scan_base_to_cloud:
  ros__parameters:
    target_frame: ""
    transform_tolerance: 0.05
    queue_size: 10

scan_merger:                  # rtabmap_util::PointCloudAggregator
  ros__parameters:
    count: 2                  # number of input clouds (cloud1, cloud2)
    frame_id: base_link       # merged cloud is expressed in this frame
    fixed_frame_id: ""        # no odom frame available upstream of ICP odometry (it consumes
                              # this cloud); lidars are near-synced at 10 Hz, so skip compensation
    approx_sync: true
    approx_sync_max_interval: 0.05   # s, both lidars run at 10 Hz
    sync_queue_size: 10
    wait_for_transform: 0.1
    xyz_output: true          # drop intensity/index channels

# ---------------------------------------------------------------------------
# Head camera (D435i colour + depth)
# ---------------------------------------------------------------------------
register_depth:               # depth_image_proc::RegisterNode (depth -> colour frame)
  ros__parameters:
    queue_size: 10
    fill_upsampling_holes: true   # depth has wider FOV / lower density than colour

rgbd_sync:                    # rtabmap_sync rgbd_sync
  ros__parameters:
    approx_sync: true
    approx_sync_max_interval: 0.02
    sync_queue_size: 10
    topic_queue_size: 2
    depth_scale: 1.0
    decimation: 1             # 2 halves image size -> faster, fewer features

# ---------------------------------------------------------------------------
# Odometry: ICP on the merged 2D scan only (no wheel odometry)
# ---------------------------------------------------------------------------
icp_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: icp_odom
    guess_frame_id: ""        # no external guess: constant-velocity model (Odom/GuessMotion)
                              # icp_odometry publishes icp_odom -> base_link
    publish_tf: true
    wait_for_transform: 0.2
    wait_imu_to_init: true    # wait for /imu before starting (aligns with gravity)
    scan_cloud_is_2d: true    # merged cloud is flattened to a 2D scan (z ignored)
    scan_cloud_max_points: 1440   # 2 lidars x 720 beams
    expected_update_rate: 20.0
    publish_null_when_lost: false

    # --- odometry strategy ---
    Odom/Strategy: "0"                 # 0=Frame-to-Map (F2M), 1=Frame-to-Frame
    Odom/ResetCountdown: "1"           # frames to wait before auto-reset when lost (0 = never)
    Odom/ScanKeyFrameThr: "0.6"        # new keyframe when correspondence ratio < this
    Odom/Holonomic: "false"            # differential drive
    Odom/GuessMotion: "true"           # predict next pose from last velocity (no wheel odom)
    OdomF2M/ScanSubtractRadius: "0.05" # m, radius for new points added to local map
    OdomF2M/ScanMaxSize: "5000"        # max points in the local scan map
    Reg/Force3DoF: "true"              # planar robot: x, y, yaw only

    # --- ICP ---
    Icp/VoxelSize: "0.05"
    Icp/RangeMin: "0.40"               # m from base_link: removes hits on the robot body (0.50 m square base)
    Icp/RangeMax: "0"                  # 0 = sensor max (10 m)
    Icp/MaxCorrespondenceDistance: "0.15"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "10"
    Icp/Iterations: "10"
    Icp/Epsilon: "0.001"
    Icp/CorrespondenceRatio: "0.3"     # min ratio of matched points to accept
    Icp/MaxTranslation: "0.3"          # m, max correction vs. motion prediction per update
    Icp/MaxRotation: "0.5"             # rad

# ---------------------------------------------------------------------------
# SLAM
# ---------------------------------------------------------------------------
rtabmap:
  ros__parameters:
    frame_id: base_link
    map_frame_id: map
    publish_tf: true          # map -> icp_odom
    subscribe_rgbd: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    scan_cloud_is_2d: true
    scan_cloud_max_points: 1440
    approx_sync: true         # rgbd (30 Hz), scan (10 Hz) and odom stamps differ
    sync_queue_size: 30
    topic_queue_size: 10
    wait_for_transform: 0.2
    map_always_update: false
    use_saved_map: true       # publish the grid saved in the database
    latch: true

    # --- core ---
    Rtabmap/DetectionRate: "8"         # Hz, how often localization is attempted
    Rtabmap/TimeThr: "0"               # ms, 0 = no limit (memory management off)
    Rtabmap/MemoryThr: "0"
    Rtabmap/LoopThr: "0.11"            # loop closure hypothesis threshold
    Mem/IncrementalMemory: "false"     # false = LOCALIZATION: map is not extended
    Mem/InitWMWithAllNodes: "true"     # load the whole map in working memory at start
    Mem/STMSize: "30"                  # short-term memory size (nodes not used for loop closure)

    # --- graph / registration ---
    RGBD/CreateOccupancyGrid: "true"
    RGBD/LinearUpdate: "0.1"           # m, min motion before trying to localize again
    RGBD/AngularUpdate: "0.1"          # rad
    RGBD/NeighborLinkRefining: "true"  # correct odom links with ICP on scans
    RGBD/ProximityBySpace: "true"      # localize by scan matching against nearby map nodes
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/LocalRadius: "2"              # m, radius for proximity detection
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/StartAtOrigin: "false"        # true = assume robot starts where the last session started
    RGBD/OptimizeMaxError: "3.0"       # reject localizations that cause large graph error (0=off)
    Reg/Strategy: "1"                  # 0=Visual, 1=ICP (visual used as guess for loop closures), 2=Visual+ICP
    Reg/Force3DoF: "true"
    Optimizer/GravitySigma: "0"        # IMU gravity constraint off (only useful with Force3DoF=false)
    Optimizer/Iterations: "20"

    # --- visual features (loop closure detection) ---
    Kp/MaxFeatures: "250"              # features for bag-of-words loop detection (-1 = off)
    Kp/DetectorStrategy: "8"           # 6=GFTT/BRIEF, 8=GFTT/ORB, 2=ORB
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "15"               # min inliers to accept a visual localization
    Vis/MaxDepth: "4.0"                # m, ignore far (noisy) features

    # --- ICP (neighbour refining, proximity and loop closure refinement) ---
    Icp/VoxelSize: "0.05"
    Icp/RangeMin: "0.40"
    Icp/RangeMax: "0"
    Icp/MaxCorrespondenceDistance: "0.15"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "10"
    Icp/Iterations: "30"
    Icp/Epsilon: "0.001"
    Icp/CorrespondenceRatio: "0.2"
    Icp/MaxTranslation: "5.0"          # m, loop closures can need larger corrections
    Icp/MaxRotation: "0.78"

    # --- occupancy grid (/map) ---
    Grid/Sensor: "0"                   # 0=lidar, 1=depth camera, 2=both
    Grid/CellSize: "0.05"              # m
    Grid/RangeMin: "0.40"              # m, ignore robot body
    Grid/RangeMax: "8.0"               # m
    Grid/RayTracing: "true"            # fill free space
    Grid/3D: "false"
    Grid/MaxGroundHeight: "0.05"       # (depth camera only) below = ground
    Grid/MaxObstacleHeight: "1.8"      # (depth camera only) above = ignored
    Grid/NormalsSegmentation: "false"  # (depth camera only)
    GridGlobal/OccupancyThr: "0.5"
